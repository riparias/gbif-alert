name: Release image

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # `latest=auto` (metadata-action default, made explicit): `latest`
          # moves only for a non-prerelease semver tag. So `v2.0.0-rc1`
          # publishes `2.0.0-rc1` without repointing `latest` - and
          # metadata-action also skips the `{{major}}.{{minor}}` floating tag
          # for prereleases. Stable tags (`v2.0.0`) still update both.
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A GitHub release (not just the tag) is what Zenodo archives and mints
      # a DOI for. Stable tags only: a release candidate must not become the
      # version the concept DOI resolves to. Notes are the CHANGELOG section
      # for this version; prepare-release.sh guarantees the heading exists.
      - name: Create GitHub release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^# / { if (found) exit; found = ($0 ~ "^# " v " ") }
            found { print }
          ' CHANGELOG.md | tail -n +2 > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
